<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explore tourist and local places in Petrer">
    <meta name="theme-color" content="#1d3557">
    <title>Explore the City - Petrer</title>
    
    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">
    <link rel="manifest" href="site.webmanifest">
    <link rel="shortcut icon" href="favicon.ico">
    
    <!-- Google Fonts - Roboto -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Estilos CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Splash Screen -->
    <div class="splash-screen" id="splashScreen">
        <div class="splash-content">
            <!-- Círculos de fondo animados -->
            <div class="splash-bg-circle circle-1"></div>
            <div class="splash-bg-circle circle-2"></div>
            <div class="splash-bg-circle circle-3"></div>
            
            <!-- Logo con múltiples capas de animación -->
            <div class="logo-container">
                <div class="logo-ring"></div>
                <div class="logo-glow"></div>
                <img src="images/logo.webp" alt="Explore The City Logo" class="splash-logo">
            </div>
        </div>
    </div>

    <!-- Navbar Desktop -->
    <nav class="navbar-desktop">
        <div class="nav-desktop-container">
            <div class="logo-desktop">
                <img src="images/logo.webp" alt="Explore The City Logo" class="logo-img">
                
            </div>
            <ul class="nav-desktop-menu">
                <li><a href="#home" class="nav-desktop-link active">Home</a></li>
                <li><a href="#about" class="nav-desktop-link">About</a></li>
                <li><a href="#contact" class="nav-desktop-link">Contact</a></li>
            </ul>
            <button class="signin-btn">Sign in</button>
        </div>
    </nav>

    <!-- Navbar Mobile Unificado -->
    <nav class="navbar-mobile">
        <div class="nav-top-row">
            <div class="logo-location">
                <img src="images/logo.webp" alt="Explore The City Logo" class="logo-img-mobile">
                <span class="location-text">Loading location...</span>
            </div>
        </div>
        <div class="search-container">
            <i class="fas fa-search search-icon"></i>
            <input type="text" class="search-input" id="searchInput" placeholder="Search places">
        </div>
    </nav>

    <!-- Bottom Navigation Bar (Mobile) -->
    <nav class="bottom-nav" id="bottomNav">
        <a href="#home" class="bottom-nav-item active" data-page="home">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>
        <a href="#favorites" class="bottom-nav-item" data-page="favorites">
            <i class="fas fa-heart"></i>
            <span>Favorites</span>
        </a>
        <a href="#events" class="bottom-nav-item" data-page="events">
            <i class="fas fa-calendar-alt"></i>
            <span>Events</span>
        </a>
        <a href="#routes" class="bottom-nav-item" data-page="routes">
            <i class="fas fa-route"></i>
            <span>Routes</span>
        </a>
        <a href="#about" class="bottom-nav-item" data-page="about">
            <i class="fas fa-user"></i>
            <span>Profile</span>
        </a>
    </nav>

    <!-- Modal Fullscreen para POIs -->
    <div class="poi-modal" id="poiModal">
        <div class="poi-modal-content">
            <div class="poi-modal-header">
                <h2 class="poi-modal-title" id="poiModalTitle">
                    <i class="fas fa-globe"></i>
                    <span>All Places</span>
                </h2>
                <button class="poi-modal-close" id="poiModalClose" aria-label="Close modal">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="poi-modal-body" id="poiModalBody">
                <div class="poi-modal-grid" id="poiModalGrid">
                    <!-- Las tarjetas de POI se cargarán aquí dinámicamente -->
                </div>
            </div>
        </div>
    </div>

    <!-- Contenido Principal -->
    <main class="main-content">

        <!-- Sección de Filtros Rápidos Mobile -->
        <section class="quick-filters-mobile" id="quickFiltersMobile">
            <a href="#favorites" class="filter-chip" data-count="">
                <i class="fas fa-heart"></i>
                <span>Favorites</span>
            </a>
            <button class="filter-chip" data-category="historical" data-count="">
                <i class="fas fa-landmark"></i>
                <span>Historical</span>
            </button>
            <button class="filter-chip" data-category="restaurants" data-count="">
                <i class="fas fa-utensils"></i>
                <span>Restaurants</span>
            </button>
            <button class="filter-chip" data-category="nature" data-count="">
                <i class="fas fa-tree"></i>
                <span>Nature</span>
            </button>
            <button class="filter-chip" data-category="events" data-count="">
                <i class="fas fa-calendar"></i>
                <span>Events</span>
            </button>
        </section>

        <!-- Layout Desktop: Una Columna con Filtros Visibles -->
        <div class="desktop-layout">
            <!-- Sección de Filtros Rápidos Desktop (similar a mobile) -->
            <section class="quick-filters-desktop" id="quickFiltersDesktop">
                <a href="#favorites" class="filter-chip" data-count="">
                    <i class="fas fa-heart"></i>
                    <span>Favorites</span>
                </a>
                <button class="filter-chip" data-category="historical" data-count="">
                    <i class="fas fa-landmark"></i>
                    <span>Historical</span>
                </button>
                <button class="filter-chip" data-category="restaurants" data-count="">
                    <i class="fas fa-utensils"></i>
                    <span>Restaurants</span>
                </button>
                <button class="filter-chip" data-category="nature" data-count="">
                    <i class="fas fa-tree"></i>
                    <span>Nature</span>
                </button>
                <button class="filter-chip" data-category="events" data-count="">
                    <i class="fas fa-calendar"></i>
                    <span>Events</span>
                </button>
            </section>

            <!-- Columna Principal: Mapa + Lista de POIs -->
            <section class="main-column">
                <!-- Búsqueda Desktop -->
                <div class="search-container-desktop">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" class="search-input-desktop" id="searchInputDesktop" placeholder="Search places">
                </div>
                
                <!-- Mapa Interactivo -->
                <div class="map-section" id="mapSection">
                    <div id="map" class="map-container">
                        <!-- Aquí se cargará Google Maps -->
                    </div>
                    
                    <!-- Botón de Geolocalización -->
                    <button class="location-btn" id="locationBtn" aria-label="My location">
                        <i class="fas fa-location-arrow"></i>
                    </button>
                </div>
            </section>
        </div>

        <!-- Sección de Favoritos (oculta inicialmente) -->
        <section class="favorites-section hidden" id="favoritesSection">
            <h2 class="section-title">
                <i class="fas fa-heart"></i> My Favorites
            </h2>
            <div id="favoritesList" class="favorites-list">
                <!-- Los favoritos se cargarán dinámicamente -->
                <p class="empty-message">You don't have any saved favorites yet.</p>
            </div>
        </section>

        <!-- Sección de Eventos (oculta inicialmente) -->
        <section class="events-section hidden" id="eventsSection">
            <h2 class="section-title">
                <i class="fas fa-calendar-alt"></i> Upcoming Events
            </h2>
            <div id="eventsList" class="events-list">
                <!-- Los eventos se cargarán desde la API -->
            </div>
        </section>

        <!-- Sección de Rutas (oculta inicialmente) -->
        <section class="routes-section hidden" id="routesSection">
            <h2 class="section-title">
                <i class="fas fa-route"></i> Hiking Routes
            </h2>
            <div id="routesList" class="routes-list">
                <!-- Las rutas se cargarán dinámicamente -->
            </div>
        </section>
    </main>

    <!-- Google Maps API -->
    <script src="js/config.js"></script>
    <script>
        // Función global para Google Maps callback
        window.initMap = function() {
            console.log('📍 Google Maps API loaded - waiting for App...');
            
            // Esperar a que App esté disponible
            const checkApp = setInterval(() => {
                if (window.App && typeof window.App.initializeMap === 'function') {
                    clearInterval(checkApp);
                    console.log('✅ Initializing map through App...');
                    window.App.initializeMap();
                }
            }, 50); // Verificar cada 50ms
            
            // Timeout de seguridad (10 segundos)
            setTimeout(() => {
                clearInterval(checkApp);
                if (!window.App) {
                    console.error('❌ App not loaded after 10 seconds');
                }
            }, 10000);
        };
        
        // Cargar Google Maps con la API Key del config
        (function() {
            const config = window.GOOGLE_MAPS_CONFIG || {};
            const apiKey = config.apiKey || 'YOUR_API_KEY';
            const libraries = (config.libraries || ['places']).join(',');
            
            const script = document.createElement('script');
            script.src = `https://maps.googleapis.com/maps/api/js?key=${apiKey}&loading=async&callback=initMap&libraries=${libraries}&v=weekly`;
            script.async = true;
            script.defer = true;
            script.onerror = function() {
                console.error('❌ Failed to load Google Maps API');
            };
            document.head.appendChild(script);
        })();
    </script>
    
    <!-- Scripts -->
    <script src="js/main.js" type="module"></script>
</body>
</html>
